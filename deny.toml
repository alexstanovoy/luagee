# cargo deny check: known vulnerabilities, licenses and where crates come from. luagee has no dependencies; this
# keeps it that way visibly and checks the fuzz workspace's.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
